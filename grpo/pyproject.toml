[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rltrain-loss"
version = "0.1.0"
description = "Explicit GRPO loss gradients with bounded vocabulary intermediates"
requires-python = ">=3.11"
dependencies = ["torch>=2.8", "numpy>=1.26"]

[project.optional-dependencies]
gpu = ["triton>=3.4"]
model = ["transformers==5.19.0", "safetensors"]

[tool.setuptools.packages.find]
where = ["src"]
